<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ficha del buey · Casa Manjavacas</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<meta property="og:title" content="Ficha del buey · Casa Manjavacas">
<meta property="og:description" content="La historia de un buey de Casa Manjavacas, de la montaña a la mesa.">
<meta property="og:image" content="https://karliox.github.io/casa-manjavacas-trazabilidad/assets/og.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="assets/marca.css">
<link rel="stylesheet" href="assets/comun.css">
</head>
<body>
<div class="aviso">Demostración · Animal y fechas de ejemplo</div>
<a class="salto" href="#contenido">Saltar al contenido</a>
<header data-cabecera="publica"></header>

<section class="ficha-hero" id="contenido">
  <div id="paisaje"></div>
  <span class="sello" id="sello">FICHA DE TRAZABILIDAD</span>
  <h1 id="nombre">—</h1>
  <p id="sub"></p>
</section>

<div class="viaje" id="viaje"></div>

<section class="band">
  <div class="in revela dos">
    <div>
      <h2>Su vida, paso a paso</h2>
      <ul class="linea" id="historia"></ul>
    </div>
    <div>
      <h2>En cifras</h2>
      <div class="datos" id="datos"></div>
      <div id="madura" style="margin-top:14px"></div>
    </div>
  </div>
</section>

<section class="band" id="bloque-cortes" style="padding-top:0;display:none">
  <div class="in revela">
    <h2>Cortes de este buey y cómo cocinarlos</h2>
    <div class="cortes" id="cortes"></div>
  </div>
</section>

<footer data-pie></footer>
<script src="assets/layout.js"></script>

<script src="assets/paisaje.js"></script>
<script src="data/bueyes.js"></script>
<script src="data/config.js"></script>
<script src="assets/app.js"></script>
<script>
CM.listo(() => {
  document.getElementById("paisaje").outerHTML = paisajeSVG({ bueyes: [[1060, 712, -1], [1240, 726, 1]] });
  const id = new URLSearchParams(location.search).get("id") || "CM-001";
  const b = CM.bueyes().find(x => x.id === id);
  if (!b) {
    document.getElementById("nombre").textContent = "Ficha no encontrada";
    document.getElementById("sub").textContent = "Revisa el código QR o el enlace.";
  } else {
    document.title = b.nombre + " · Casa Manjavacas";
    document.getElementById("sello").textContent = "FICHA DE TRAZABILIDAD · " + b.id;
    document.getElementById("nombre").textContent = b.nombre;
    document.getElementById("sub").textContent = `${b.raza} · Montaña Palentina · ${CM.ESTADOS[b.estado]}`;

    const ev = t => (b.eventos.find(e => e.tipo === t) || {}).fecha;
    const nivel = CM.ORDEN[b.estado];
    const fechas = [b.entrada, b.entrada, ev("alimentacion"), ev("maduracion") || b.sacrificio, b.estado === "vendido" ? ev("maduracion") : null];
    document.getElementById("viaje").innerHTML = CM.ETAPAS.map((e, i) => {
      const clase = i < nivel ? "hecha" : i === nivel ? "ahora" : "pendiente";
      const cuando = clase === "pendiente" ? "Pendiente" : (fechas[i] ? CM.fmtCorto(fechas[i]) : "");
      return `<div class="etapa ${clase}"><div class="punto"></div><div><b>${e.nombre}</b><span>${cuando}</span></div></div>`;
    }).join("");

    const datos = [
      ["Nacimiento", CM.fmtCorto(b.nacimiento)],
      ["Meses en la explotación", CM.meses(b.entrada, b.sacrificio)],
      b.pesoCanal ? ["Peso de la canal", b.pesoCanal + " kg"] : ["Último pesaje", CM.num(b.pesoVivo) + " kg"],
      ["Sacrificio", b.sacrificio ? CM.fmtCorto(b.sacrificio) : "Aún en la explotación"]
    ];
    document.getElementById("datos").innerHTML = datos.map(([k, v]) => `<div class="dato"><span>${k}</span><b>${CM.esc(v)}</b></div>`).join("");

    if (b.diasMaduracion) {
      const hechos = b.estado === "maduracion" ? Math.min(CM.dias(ev("maduracion")), b.diasMaduracion) : b.diasMaduracion;
      const p = hechos / b.diasMaduracion, R = 46, L = 2 * Math.PI * R;
      document.getElementById("madura").innerHTML = `<div class="madura">
        <svg viewBox="0 0 110 110" aria-hidden="true"><circle cx="55" cy="55" r="${R}" fill="none" stroke="rgba(243,234,219,.14)" stroke-width="8"/>
        <circle cx="55" cy="55" r="${R}" fill="none" stroke="#d4a85a" stroke-width="8" stroke-linecap="round" stroke-dasharray="${L * p} ${L}" transform="rotate(-90 55 55)"/>
        <text x="55" y="60" text-anchor="middle" fill="#f3eadb" font-family="Fraunces,Georgia,serif" font-size="24">${hechos}</text></svg>
        <div><b style="font-family:var(--serif);font-weight:400;font-size:22px">${b.estado === "maduracion" ? `Día ${hechos} de ${b.diasMaduracion}` : b.diasMaduracion + " días de maduración"}</b>
        <p style="margin:4px 0 0;color:var(--crema2);font-size:15px">${b.estado === "maduracion" ? "Ahora mismo en cámara, perdiendo agua y ganando sabor." : "En seco y en cámara, para concentrar el sabor y ablandar la fibra."}</p></div></div>`;
    }

    document.getElementById("historia").innerHTML = b.eventos.map(e =>
      `<li><time>${CM.fmt(e.fecha)} · ${CM.TIPOS[e.tipo] || "Evento"}</time>${CM.esc(e.texto)}</li>`).join("");

    if (b.cortes && b.cortes.length) {
      document.getElementById("bloque-cortes").style.display = "";
      document.getElementById("cortes").innerHTML = b.cortes.map(c =>
        `<div class="corte"><h3>${CM.esc(c)}</h3><p>${CM.esc(CM.COCINA[c] || "Consulta a tu carnicero.")}</p></div>`).join("");
    }
  }
});
</script>
</body>
</html>
