<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registrar evento — Casa Manjavacas</title>
<link rel="stylesheet" href="assets/estilo.css">
</head>
<body>
<div class="demo">DEMO · Los eventos se guardan solo en este navegador</div>
<header class="top">
  <a class="marca" href="index.html">Casa Manjavacas<small>Buey de ceba extensiva · Montaña Palentina</small></a>
  <nav><a href="index.html">Panel</a><a class="activo" href="registrar.html">Registrar evento</a></nav>
</header>
<main>
  <h1>Registrar evento</h1>
  <p class="sub">Pensado para apuntarlo desde el móvil en el campo, en menos de un minuto.</p>
  <form class="card" id="form">
    <label for="id">Animal</label>
    <select id="id" required></select>
    <label for="tipo">Tipo de evento</label>
    <select id="tipo" required></select>
    <label for="fecha">Fecha</label>
    <input type="date" id="fecha" required>
    <label for="texto">Descripción</label>
    <textarea id="texto" rows="3" required placeholder="Ej.: Pesaje: 1.020 kg en vivo."></textarea>
    <p><button class="btn" type="submit">Guardar evento</button></p>
    <div class="ok" id="ok"></div>
  </form>
</main>
<script src="data/bueyes.js"></script>
<script src="assets/app.js"></script>
<script>
  const sel = document.getElementById("id");
  sel.innerHTML = CM.bueyes().map(b => `<option value="${CM.esc(b.id)}">${CM.esc(b.id)} · ${CM.esc(b.nombre)}</option>`).join("");
  document.getElementById("tipo").innerHTML = Object.entries(CM.TIPOS).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
  document.getElementById("fecha").value = new Date().toISOString().slice(0, 10);
  document.getElementById("form").addEventListener("submit", e => {
    e.preventDefault();
    const ev = {
      id: sel.value, tipo: document.getElementById("tipo").value,
      fecha: document.getElementById("fecha").value, texto: document.getElementById("texto").value.trim()
    };
    const ok = document.getElementById("ok");
    if (CM.guardarEventoLocal(ev)) {
      ok.innerHTML = `Guardado. <a href="ficha.html?id=${encodeURIComponent(ev.id)}">Ver la ficha de ${CM.esc(ev.id)}</a>`;
      document.getElementById("texto").value = "";
    } else {
      ok.textContent = "Este navegador no permite guardar datos. En la versión real se guardará en una base de datos.";
    }
    ok.style.display = "block";
  });
</script>
</body>
</html>
