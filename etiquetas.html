<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Etiquetas · Casa Manjavacas</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7a2e2a">
<link rel="apple-touch-icon" href="assets/icono-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/estilo.css">
<link rel="stylesheet" href="assets/comun.css">
<style>
/*
VOICE: herramienta de trabajo, clara y rápida.
IDEA: la etiqueta de papel que va pegada al envase de cada pieza.
PICTURE: la propia hoja A4 de etiquetas, tal cual saldrá de la impresora.
COLOUR and TYPE: los de la marca sobre papel; serif para el nombre del buey.
LAYOUT: formulario a la izquierda, vista previa de la hoja a la derecha.
*/
@import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Inter:wght@400;600&display=swap");
.trabajo{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:28px;align-items:start}
.filas{display:grid;gap:8px;margin:10px 0}
.fila{display:grid;grid-template-columns:minmax(0,1fr) 90px 36px;gap:8px}
.fila button{border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-size:18px}
.hoja{background:#fff;width:210mm;height:297mm;flex:none;box-shadow:0 10px 30px rgba(60,40,20,.15);padding:8mm 6mm;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:66mm;gap:3mm;overflow:hidden;margin-bottom:20px}
.et{border:1px dashed #cdbfae;border-radius:3mm;padding:4mm 4mm 3mm;display:grid;grid-template-columns:minmax(0,1fr) 26mm;gap:3mm;font-family:Inter,system-ui,sans-serif;color:#14110f;background:#fbf7f0;position:relative;overflow:hidden}
.et .marca2{font-family:Fraunces,Georgia,serif;color:#9e3222;font-size:12pt;letter-spacing:.02em}
.et .sub2{font-size:6.5pt;letter-spacing:.12em;color:#7a6a5d;text-transform:uppercase}
.et .corte{font-family:Fraunces,Georgia,serif;font-size:17pt;line-height:1.05;margin:2.5mm 0 1.5mm}
.et dl{display:grid;grid-template-columns:auto 1fr;gap:.6mm 3mm;margin:0;font-size:7.5pt}
.et dt{color:#7a6a5d}.et dd{margin:0;font-weight:600}
.et .qr{align-self:start}.et .qr svg{width:26mm;height:26mm}
.et .esc{font-size:6pt;color:#7a6a5d;text-align:center;margin-top:1mm}
.et .peso{position:absolute;right:4mm;bottom:3mm;font-family:Fraunces,Georgia,serif;font-size:15pt}
.vista{overflow:auto}
@media (max-width:900px){.trabajo{grid-template-columns:1fr}}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .demo,.cabecera,.pie-web,.salto,.panelform,h1,.sub{display:none!important}
  main{padding:0;max-width:none}
  .trabajo{display:block}
  .hoja{box-shadow:none;margin:0;width:210mm;height:297mm;max-width:none;page-break-after:always}
  .et{border-color:#ddd}
}
</style>
</head>
<body>
<div class="demo">SIMULACIÓN · Bueyes de ejemplo</div>
<a class="salto" href="#contenido">Saltar al contenido</a>
<header data-cabecera="ganadero"></header>
<main id="contenido">
  <h1>Etiquetas para las piezas</h1>
  <p class="sub">Elige el buey, apunta cada pieza con su peso e imprime en A4. Cada etiqueta lleva el QR a la ficha de ese buey. Ocho etiquetas por hoja.</p>
  <div class="trabajo">
    <form class="card panelform" id="form">
      <label for="buey">Buey</label>
      <select id="buey"></select>
      <label for="envasado">Fecha de envasado</label>
      <input type="date" id="envasado">
      <label>Piezas (corte y peso en kg)</label>
      <div class="filas" id="filas"></div>
      <p><button type="button" class="btn sec" id="mas">Añadir pieza</button></p>
      <p><button type="button" class="btn" id="imprimir">Imprimir etiquetas</button></p>
      <p class="nota" id="aviso"></p>
    </form>
    <div class="vista" id="vista"></div>
  </div>
</main>
<footer data-pie></footer>
<script src="assets/layout.js"></script>
<script src="assets/qrcode.js"></script>
<script src="data/bueyes.js"></script>
<script src="data/config.js"></script>
<script src="assets/app.js"></script>
<script>
CM.listo(() => {
  const lista = CM.bueyes().filter(b => b.sacrificio);
  const sel = document.getElementById("buey"), filas = document.getElementById("filas");
  sel.innerHTML = lista.map(b => `<option value="${CM.esc(b.id)}">${CM.esc(b.id)} · ${CM.esc(b.nombre)}</option>`).join("");
  document.getElementById("envasado").value = window.FECHA_DEMO || new Date().toISOString().slice(0, 10);

  const fila = (corte, peso) => {
    const d = document.createElement("div"); d.className = "fila";
    d.innerHTML = `<input class="c" value="${CM.esc(corte)}" aria-label="Corte"><input class="p" type="number" step="0.01" min="0" value="${peso}" aria-label="Peso en kg"><button type="button" aria-label="Quitar pieza">×</button>`;
    d.querySelector("button").addEventListener("click", () => { d.remove(); pintar(); });
    d.addEventListener("input", pintar);
    filas.appendChild(d);
  };
  const cargar = () => {
    filas.innerHTML = "";
    const b = lista.find(x => x.id === sel.value);
    (b.cortes || ["Chuletón"]).forEach(c => fila(c, c === "Solomillo" ? 0.8 : c === "Chuletón" ? 1.2 : 1.0));
    pintar();
  };
  function pintar() {
    const b = lista.find(x => x.id === sel.value);
    const env = document.getElementById("envasado").value;
    const piezas = [...filas.querySelectorAll(".fila")].map(f => ({ c: f.querySelector(".c").value.trim(), p: parseFloat(f.querySelector(".p").value) || 0 })).filter(x => x.c);
    const fd = f => f ? new Date(f + "T12:00:00").toLocaleDateString("es-ES") : "—";
    const qr = CM.qrSVG(CM.urlFicha(b.id), "#14110f");
    const et = x => `<div class="et">
      <div>
        <div class="marca2">Casa Manjavacas</div>
        <div class="sub2">Buey de la Montaña Palentina</div>
        <div class="corte">${CM.esc(x.c)}</div>
        <dl>
          <dt>Buey</dt><dd>${CM.esc(b.nombre)} · ${CM.esc(b.id)}</dd>
          <dt>Raza</dt><dd>${CM.esc(b.raza)}</dd>
          <dt>Crianza</dt><dd>Extensiva, ${CM.meses(b.entrada, b.sacrificio)} meses</dd>
          <dt>Sacrificio</dt><dd>${fd(b.sacrificio)}</dd>
          <dt>Maduración</dt><dd>${b.diasMaduracion ? b.diasMaduracion + " días" : "—"}</dd>
          <dt>Envasado</dt><dd>${fd(env)}</dd>
        </dl>
      </div>
      <div class="qr">${qr}<div class="esc">Escanea y conoce<br>a tu buey</div></div>
      <div class="peso">${x.p.toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} kg</div>
    </div>`;
    const hojas = [];
    for (let i = 0; i < piezas.length; i += 8) hojas.push(`<div class="hoja">${piezas.slice(i, i + 8).map(et).join("")}</div>`);
    document.getElementById("vista").innerHTML = hojas.join("") || `<p class="sub">Añade al menos una pieza.</p>`;
    document.getElementById("aviso").textContent = piezas.length ? `${piezas.length} etiquetas en ${hojas.length} ${hojas.length === 1 ? "hoja" : "hojas"}.` : "";
  }
  sel.addEventListener("change", cargar);
  document.getElementById("envasado").addEventListener("input", pintar);
  document.getElementById("mas").addEventListener("click", () => { fila("", 1.0); pintar(); });
  document.getElementById("imprimir").addEventListener("click", () => { try { window.print(); } catch (e) {} });
  cargar();
});
</script>
</body>
</html>
